
name: CSC325 Four-Stage CI/CD

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify Python
        run: python --version

  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Check installed packages
        run: python -m pip check

  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-24.04

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest booking/tests/unit

      - name: Run integration tests
        run: python manage.py test booking.tests.integration

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Simulate deployment
        run: |
          echo "Deployment simulated successfully."
          echo "Tests passed for commit: $GITHUB_SHA"
          echo "Echo-only deployment; no hosting configured."
